[project]
name = "bellatrex"
dynamic = ["version"]
description = "Explaining Random Forest model predictions by Building Explanations through a LocaLly AccuraTe Rule EXtractor"
readme = "README.md"
authors = [
    { name = "Klest Dedja", email = "klest.dev@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10, <4.0"
keywords = ["explainable AI", "rule extraction", "random forest", "surrogate models"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy >=1.21",
    "pandas >=1.5",
    "scipy >=1.11",
    "matplotlib >=3.7",
    "scikit-learn >=1.2",
    "scikit-survival >=0.22",
    "joblib >=1.3",
    "nicegui>=3.0",
    "pywebview>=5.1",
    "plotly>=6.0",
]

# Dependencies for testing and development.
[project.optional-dependencies]
dev = [
    "ipykernel",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "black == 26.5.1",
    "ruff == 0.15.22",
    "mypy == 2.3.0",
    "nbstripout >= 0.6",
]

# TODO: move this to normal dependencies (0.4.1), drop separation
# consider adding a [performance] one or similar
# with "bottleneck", # needed for pandas performance (not a requirement! move out from here)
# and numpyexpr or smth

[tool.black]
line-length = 100
target-version = ['py310']
skip-string-normalization = false
exclude = '''
/(
    \.venv
  | build
  | dist
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | \.tox
  | __pycache__
    | tmp[^/]*
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    ".venv-*",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort
select = ["E", "F", "W", "I"]
# E501 (line-too-long) is handled by black; E741 (ambiguous var names) too noisy for now
ignore = ["E501", "E741"]

[tool.mypy]
# Gradual baseline: mypy is the single type-checking authority in the editor and CI.
# Function bodies without annotations are intentionally deferred for now.
python_version = "3.12"
files = ["app/bellatrex"]
ignore_missing_imports = true
allow_untyped_defs = true
allow_untyped_calls = true
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
pretty = true

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.dynamic]
version = { attr = "bellatrex.__version__" }

[tool.setuptools.package-data]
"bellatrex.datasets" = ["*.csv"]

[tool.coverage.run]
source = ["app/bellatrex"]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_covered = true


[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
