name: Tutorial smoke

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorial-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Install the built wheel and notebook tools
        run: python -m pip install dist/*.whl nbclient ipykernel
      - name: Execute script and notebook without a display
        run: python scripts/smoke_tutorials.py
