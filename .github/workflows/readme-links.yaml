name: README links

on:
  pull_request:
    branches: [ dev, main ]
    paths:
      - README.md
      - .github/workflows/readme-links.yaml
  push:
    branches: [ dev, main ]
    paths:
      - README.md
      - .github/workflows/readme-links.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-readme-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check README links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --accept 200..=299,403,429
            README.md
          fail: true
          failIfEmpty: true
          token: ${{ secrets.GITHUB_TOKEN }}
